services:
  animeman:
    build:
      context: .
      args:
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    # Grace expiry reports and waits; never turn that wait into SIGKILL.
    stop_grace_period: -1s
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      TZ: Asia/Shanghai
      SECRET_KEY: ${SECRET_KEY:?Set a private random SECRET_KEY in .env}
      CONFIG_PATH: /app/config/auto_config.json
      CACHE_PATH: /app/cache
      LOG_PATH: /app/logs
      ANIMEMAN_WORK_PATH: /app/work
      TMPDIR: /app/work
      ANIMEMAN_SHUTDOWN_GRACE: ${SHUTDOWN_GRACE:-30}
      ANIMEMAN_THREADS: ${HTTP_THREADS:-8}
      SOURCE_FOLDERS: /media/source
      TV_TARGET_FOLDER: /media/tv
      MOVIE_TARGET_FOLDER: /media/movies
    volumes:
      - type: bind
        source: ./config
        target: /app/config
        bind: {create_host_path: false}
      - type: bind
        source: ./cache
        target: /app/cache
        bind: {create_host_path: false}
      - type: bind
        source: ./logs
        target: /app/logs
        bind: {create_host_path: false}
      - type: bind
        source: ./work
        target: /app/work
        bind: {create_host_path: false}
      - type: bind
        source: ${SOURCE_DIR:?Set SOURCE_DIR}
        target: /media/source
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TV_DIR:?Set TV_DIR}
        target: /media/tv
        bind: {create_host_path: false}
      - type: bind
        source: ${MOVIE_DIR:?Set MOVIE_DIR}
        target: /media/movies
        bind: {create_host_path: false}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
