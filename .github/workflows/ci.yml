name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12.15'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '26.13.1', cache: npm}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check && python tools/check_dependencies.py
      - run: python tools/check_syntax.py
      - run: find static/js tests -name '*.js' -o -name '*.cjs' | xargs -n1 node --check
      - run: python -m pytest -q --tb=short > python-results.txt 2>&1
        env: {PYTHONDONTWRITEBYTECODE: '1'}
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - run: npm run test:ui > browser-results.txt 2>&1
        env: {ANIMEMAN_TEST_PYTHON: python}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with: {name: regression-logs, path: '*-results.txt'}
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12.15'}
      - run: python tools/build_context_smoke.py > context-results.txt 2>&1
      - name: Build with a dummy secret sentinel excluded from the context
        run: |
          printf 'SYNTHETIC-NOT-A-SECRET\n' > build-context-secret.txt
          docker build --progress=plain -t animeman:ci . > docker-build-results.txt 2>&1
      - run: python tools/deployment_smoke.py --docker animeman:ci > docker-smoke-results.txt 2>&1
      - run: python tools/compose_smoke.py animeman:ci > compose-results.txt 2>&1
      - name: NAS identity with an existing base-image group
        run: |
          docker build --progress=plain --build-arg APP_UID=1026 --build-arg APP_GID=100 -t animeman:custom . > identity-build-results.txt 2>&1
          python tools/compose_smoke.py animeman:custom --uid 1026 --gid 100 > identity-smoke-results.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with: {name: container-logs, path: '*-results.txt'}
  windows-paths:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12.15'}
      - name: Enable long paths and unprivileged symbolic links on this disposable runner
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Type DWord -Value 1
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Type DWord -Value 1
      - run: python tools/windows_smoke.py > windows-results.txt 2>&1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with: {name: windows-logs, path: windows-results.txt}
