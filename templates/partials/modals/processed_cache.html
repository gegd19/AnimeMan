<div id="processedCacheModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="processedCacheModalTitle">
    <div class="modal-content modal-xl" tabindex="-1">
        <div class="modal-header">
            <h3 id="processedCacheModalTitle">已处理缓存</h3>
            <button type="button" class="modal-close" aria-label="关闭" onclick="App.ProcessedCache.closeModal()"><span class="icon i-close" aria-hidden="true"></span></button>
        </div>
        <div class="modal-body">
            <div class="toolbar">
                <span class="count">本页 <span id="processedCacheCount">0</span> 条，已选 <span id="selectedProcessedCount">0</span> 条</span>
                <button type="button" onclick="App.ProcessedCache.batchCorrectSelected()" id="batchCorrectProcessedBtn" class="success" disabled>批量修正</button>
                <button type="button" onclick="App.ProcessedCache.smartSortAndBatchCorrect()" class="success" title="按文件名里的集号排序后再批量修正">按集号排序并修正</button>
                <button type="button" onclick="App.ProcessedCache.batchDeleteSelected()" id="batchDeleteProcessedBtn" class="danger" disabled title="只删除缓存记录，不删除文件">删除选中记录</button>
                <span class="spacer"></span>
                <button type="button" onclick="App.ProcessedCache.clearAllCache()" class="danger" title="只清空缓存记录，不删除文件">清空全部缓存</button>
            </div>
            <div class="toolbar">
                <button type="button" onclick="App.ProcessedCache.toggleSelectAll(true)" class="secondary btn-sm">全选本页</button>
                <button type="button" onclick="App.ProcessedCache.toggleSelectAll(false)" class="secondary btn-sm">取消全选</button>
                <button type="button" onclick="App.ProcessedCache.invertSelection()" class="secondary btn-sm">反选本页</button>
                <span class="spacer"></span>
                <label class="sr-only" for="processedCacheSortSelect">排序方式</label>
                <select id="processedCacheSortSelect" onchange="App.ProcessedCache.setSort(this.value)">
                    <option value="processed_time">按处理时间</option>
                    <option value="confidence">按匹配评分</option>
                    <option value="title">按标题</option>
                    <option value="src_name">按文件名</option>
                </select>
                <label class="sr-only" for="processedCacheSearchInput">搜索源文件名或标题</label>
                <input type="search" id="processedCacheSearchInput" placeholder="搜索源文件名或标题" autocomplete="off" oninput="App.ProcessedCache.filterTable(this.value)">
            </div>
            <div class="table-wrap is-tall">
                <table class="failed-table rows-as-cards" id="processedCacheTable">
                    <thead>
                        <tr>
                            <th style="width:40px;"><input type="checkbox" id="processedCacheSelectAll" aria-label="全选本页" onchange="App.ProcessedCache.toggleSelectAll(this.checked)"></th>
                            <th style="width:18%;" data-sort="src_name">源文件</th>
                            <th style="width:15%;">所在目录</th>
                            <th style="width:18%;">目标文件</th>
                            <th style="width:15%;" data-sort="title">类型/标题</th>
                            <th style="width:9%;" data-sort="confidence" onclick="App.ProcessedCache.setSort('confidence')">匹配评分</th>
                            <th style="width:12%;" data-sort="processed_time" onclick="App.ProcessedCache.setSort('processed_time')">处理时间</th>
                            <th style="width:170px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="processedCacheBody">
                        <tr><td colspan="8">加载中…</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="processedCachePagination"></div>
            <p class="note">清空或删除缓存记录不会删除实际文件，但下次扫描会重新处理对应的视频。「手动修正」可以重新选择 TMDB 匹配。</p>
        </div>
    </div>
</div>
