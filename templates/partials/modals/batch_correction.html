<div id="batchCorrectionModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="batchCorrectionModalTitle">
    <div class="modal-content modal-lg" tabindex="-1">
        <div class="modal-header">
            <h3 id="batchCorrectionModalTitle">批量手动修正</h3>
            <button type="button" class="modal-close" aria-label="关闭" onclick="App.BatchCorrection.closeModal()"><span class="icon i-close" aria-hidden="true"></span></button>
        </div>
        <div class="modal-body">
            <div class="file-summary"><span class="text-muted">来源：</span><strong id="batchFolderPath"></strong></div>
            <div>
                <h4>文件列表（已勾选 <span id="batchFileCount">0</span> 个，勾选的才会处理）</h4>
                <div id="batchFileList" class="list-box" style="margin-top: 8px;"></div>
            </div>
            <div class="field">
                <label for="batchTmdbSearchInput">TMDB 搜索</label>
                <div class="field-control">
                    <input type="search" id="batchTmdbSearchInput" placeholder="输入标题搜索" autocomplete="off" enterkeyhint="search">
                    <select id="batchTmdbSearchType" class="narrow" aria-label="媒体类型"><option value="tv">剧集</option><option value="movie">电影</option></select>
                    <button type="button" onclick="App.BatchCorrection.searchTmdb()">搜索</button>
                </div>
            </div>
            <div id="batchTmdbResults" class="list-box" style="max-height: 240px;"></div>
            <div id="batchSelectedTmdbInfo" class="selected-info" style="display:none;">
                <strong>已选择：</strong><span id="batchSelectedTmdbTitle"></span> (ID: <span id="batchSelectedTmdbId"></span>)
            </div>
            <div class="field"><label for="batchSeason">季号</label><input type="number" id="batchSeason" class="field-inline" min="0" value="1" inputmode="numeric"></div>
            <div class="field"><label for="batchStartEpisode">起始集号</label><input type="number" id="batchStartEpisode" class="field-inline" min="1" value="1" inputmode="numeric"></div>
            <div class="field"><label for="batchEpisodeIncrement">集号增量</label><input type="number" id="batchEpisodeIncrement" class="field-inline" min="1" value="1" inputmode="numeric"></div>
            <label class="check">
                <input type="checkbox" id="batchAutoSeasonCheck">
                <span>自动跨季换算<small>把起始集号当作绝对集数，按 TMDB 的季结构计算实际季/集（不含特典季 S0）。</small></span>
            </label>
            <p class="note">按列表顺序依次处理勾选的文件，集号自动递增。</p>
            <div class="modal-actions">
                <button type="button" onclick="App.BatchCorrection.closeModal()" class="secondary">取消</button>
                <button type="button" onclick="App.BatchCorrection.execute()" class="success primary">开始批量修正</button>
            </div>
        </div>
    </div>
</div>
