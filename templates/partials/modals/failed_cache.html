<div id="failedCacheModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="failedCacheModalTitle">
    <div class="modal-content modal-lg" tabindex="-1">
        <div class="modal-header">
            <h3 id="failedCacheModalTitle">失败缓存</h3>
            <button type="button" class="modal-close" aria-label="关闭" onclick="App.FailedCache.closeFailedCacheModal()"><span class="icon i-close" aria-hidden="true"></span></button>
        </div>
        <div class="modal-body">
            <div class="toolbar">
                <span class="count">共 <span id="failedCount">0</span> 条失败记录</span>
                <span class="spacer"></span>
                <button type="button" onclick="App.FailedCache.clearFailedCache()" class="danger" title="只清空失败记录，不删除任何文件">清空失败缓存</button>
            </div>
            <div id="failedCacheList" class="list-box">
                <div class="empty-state">加载中…</div>
            </div>
            <p class="note">这些文件没能自动识别。可以逐个修正，或按文件夹批量修正。清空失败缓存只移除记录，不删除任何文件。</p>
        </div>
    </div>
</div>
