<div id="mappingModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mappingModalTitle">
    <div class="modal-content modal-sm" tabindex="-1">
        <div class="modal-header">
            <h3 id="mappingModalTitle">新增映射规则</h3>
            <button type="button" class="modal-close" aria-label="关闭" onclick="App.MappingRules.closeMappingModal()"><span class="icon i-close" aria-hidden="true"></span></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editingMappingIndex" value="-1">
            <div class="field"><label for="mappingKeyword">关键词 *</label><input type="text" id="mappingKeyword" placeholder="例如：[OVA] 某科学的超电磁炮" autocomplete="off"></div>
            <div class="field"><label for="mappingTmdbId">TMDB ID *</label><input type="number" id="mappingTmdbId" placeholder="例如：4604" inputmode="numeric"></div>
            <div class="field"><label for="mappingMediaType">媒体类型 *</label><select id="mappingMediaType"><option value="tv">剧集 (TV)</option><option value="movie">电影 (Movie)</option></select></div>
            <div id="mappingTvFields" class="field-group">
                <div class="field"><label for="mappingSeason">季号 *</label><input type="number" id="mappingSeason" class="field-inline" value="0" min="0" inputmode="numeric"></div>
                <div class="field"><label for="mappingEpisode">集号 *</label><input type="number" id="mappingEpisode" class="field-inline" value="1" min="1" inputmode="numeric"></div>
            </div>
            <div class="field"><label for="mappingDescription">描述（可选）</label><input type="text" id="mappingDescription" placeholder="备注说明" autocomplete="off"></div>
            <label class="check"><input type="checkbox" id="mappingEnabled" checked><span>启用该规则</span></label>
            <div class="modal-actions">
                <button type="button" onclick="App.MappingRules.closeMappingModal()" class="secondary">取消</button>
                <button type="button" onclick="App.MappingRules.saveMappingRule()" class="success primary">保存</button>
            </div>
        </div>
    </div>
</div>
