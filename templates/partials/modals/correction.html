<div id="correctionModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="correctionModalTitle">
    <div class="modal-content modal-md" tabindex="-1">
        <div class="modal-header">
            <h3 id="correctionModalTitle">手动修正并重新处理</h3>
            <button type="button" class="modal-close" aria-label="关闭" onclick="App.Correction.closeCorrectionModal()"><span class="icon i-close" aria-hidden="true"></span></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="correctionSrcPath">
            <div class="file-summary">
                <div><span class="text-muted">文件：</span><strong id="correctionFileName"></strong></div>
                <div class="path"><span>位置：</span><span id="correctionFileLocation"></span></div>
            </div>

            <div class="field">
                <label for="tmdbSearchInput">TMDB 搜索</label>
                <div class="field-control">
                    <input type="search" id="tmdbSearchInput" placeholder="输入标题搜索" autocomplete="off" enterkeyhint="search">
                    <select id="tmdbSearchType" class="narrow" aria-label="媒体类型">
                        <option value="tv">剧集</option>
                        <option value="movie">电影</option>
                    </select>
                    <button type="button" onclick="App.Correction.searchTmdbForCorrection()" id="correctionSearchBtn" class="btn-search">搜索</button>
                </div>
            </div>

            <div class="table-wrap" style="max-height: 300px;">
                <table class="failed-table" id="tmdbSearchResults">
                    <thead>
                        <tr>
                            <th>海报</th>
                            <th>标题</th>
                            <th>年份</th>
                            <th>季集数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tmdbResultsBody">
                        <tr><td colspan="5">输入关键词搜索</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="selectedTmdbInfo" class="selected-info" style="display:none;">
                <strong>已选择：</strong><span id="selectedTmdbTitle"></span> (ID: <span id="selectedTmdbId"></span>)
            </div>
            <div class="field">
                <label for="correctionSeason">季号（可选）</label>
                <input type="number" id="correctionSeason" class="field-inline" min="0" value="1" inputmode="numeric">
            </div>
            <div class="field">
                <label for="correctionEpisode">集号（可选）</label>
                <input type="number" id="correctionEpisode" class="field-inline" min="1" value="1" inputmode="numeric">
                <p class="field-hint">电影不需要季号和集号。</p>
            </div>
            <div class="modal-actions">
                <button type="button" onclick="App.Correction.closeCorrectionModal()" class="secondary">取消</button>
                <button type="button" onclick="App.Correction.executeCorrection()" class="success primary">确认修正并重新处理</button>
            </div>
        </div>
    </div>
</div>
