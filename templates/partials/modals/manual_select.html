<div id="manualSelectModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="manualSelectModalTitle">
    <div class="modal-content modal-md" tabindex="-1">
        <div class="modal-header">
            <h3 id="manualSelectModalTitle">选择目标媒体</h3>
            <button type="button" class="modal-close" aria-label="关闭" onclick="App.MediaLibrary.closeManualSelectModal()"><span class="icon i-close" aria-hidden="true"></span></button>
        </div>
        <div class="modal-body">
            <div class="file-summary">
                <span class="text-muted">当前：</span><strong id="currentSubtitleName">-</strong>
            </div>
            <div class="field">
                <label for="mediaSearchInput">搜索</label>
                <input type="search" id="mediaSearchInput" placeholder="输入标题或年份过滤" autocomplete="off" oninput="App.MediaLibrary.filterMediaLibrary()">
            </div>
            <div id="mediaLibraryContainer" class="picker"></div>
            <p class="note">点击剧集展开季列表，再点击季展开集数。</p>
        </div>
    </div>
</div>
