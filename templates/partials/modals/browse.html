<div id="browseModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="browseModalTitle">
    <div class="modal-content" tabindex="-1">
        <div class="modal-header">
            <h3 id="browseModalTitle">选择文件夹</h3>
            <button type="button" class="modal-close" aria-label="关闭" onclick="App.Browse.closeModal()"><span class="icon i-close" aria-hidden="true"></span></button>
        </div>
        <div class="modal-body">
            <div class="path-nav"><b>当前位置</b> <span id="currentPath">/</span></div>
            <div class="toolbar">
                <button type="button" onclick="App.Browse.goUp()">上一级</button>
                <button type="button" onclick="App.Browse.loadDrives()">根目录</button>
                <span class="spacer"></span>
                <button type="button" class="success primary" onclick="App.Browse.selectCurrentPath()">选择此文件夹</button>
            </div>
            <ul class="dir-list" id="dirList"></ul>
        </div>
    </div>
</div>
