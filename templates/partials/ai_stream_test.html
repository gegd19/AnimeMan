<section class="sheet card" id="stream-card" aria-labelledby="streamTitle">
    <div class="sheet-head">
        <div>
            <h2 id="streamTitle">AI 简介润色测试</h2>
            <p class="hint" id="streamHint" data-hint-for="streamTitle">使用「设置」里的 AI 提供商、模型和密钥，逐字生成一段润色后的简介。</p>
        </div>
    </div>
    <div class="sheet-body">
        <div class="field">
            <label for="testTitle">标题</label>
            <input type="text" id="testTitle" placeholder="例如：权力的游戏" value="龙族">
        </div>
        <div class="field">
            <label for="testPlot">原始简介</label>
            <textarea id="testPlot" rows="3">少年楚子航觉醒龙族血脉，手持村雨踏上屠龙之路。</textarea>
        </div>
        <div class="toolbar" style="margin: 16px 0;">
            <button type="button" onclick="App.AIStream.startStreamEnhance()" class="primary">开始生成</button>
            <button type="button" onclick="App.AIStream.copyStreamResult()" class="secondary">复制结果</button>
        </div>
        <div class="stream-output" id="streamOutput" aria-label="生成结果"></div>
    </div>
</section>
