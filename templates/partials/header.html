<!-- 任务条：在所有页面都可见的任务状态、进度和启停 -->
<header class="taskbar" id="taskBar" data-state="idle">
    <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true" focusable="false">
        <!-- 定位尺：一张动画纸上方的三个定位孔，下面是播放键。孔和三角是镂空的。 -->
        <path fill="currentColor" fill-rule="evenodd" d="M9 2h16a7 7 0 0 1 7 7v16a7 7 0 0 1-7 7H9a7 7 0 0 1-7-7V9a7 7 0 0 1 7-7zM9.2 7.4h2.6a1.7 1.7 0 0 1 0 3.4H9.2a1.7 1.7 0 0 1 0-3.4zM17 7a2.1 2.1 0 1 1 0 4.2A2.1 2.1 0 1 1 17 7zM22.2 7.4h2.6a1.7 1.7 0 0 1 0 3.4h-2.6a1.7 1.7 0 0 1 0-3.4zM13.6 15.4v11.2l9.6-5.6z"/>
    </svg>
    <div class="task-state">
        <span class="task-dot" aria-hidden="true"></span>
        <div class="status" role="status" aria-live="polite">
            <span id="statusText">空闲</span>
        </div>
        <span class="badge is-amber" id="dryRunBadge" hidden title="已保存配置开启模拟；正在执行的任务仍使用启动时的配置，保存不会改变该任务的运行方式">已保存：模拟</span>
    </div>
    <div class="task-progress">
        <div class="progress-bar" id="taskProgress" role="progressbar" aria-label="任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressFill" class="progress-fill" style="width:0%">0%</div>
        </div>
        <span class="task-percent" id="taskPercent" aria-hidden="true">尚未开始</span>
    </div>
    <div class="task-actions">
        <button type="button" id="stopBtn" onclick="App.Task.stopTask()" class="danger" disabled><span class="icon i-stop" aria-hidden="true"></span><span>停止<span class="wide-only">任务</span></span></button>
        <button type="button" id="runBtn" onclick="App.Task.startTask()" class="primary"><span class="icon i-play" aria-hidden="true"></span><span>开始<span class="wide-only">处理</span></span></button>
    </div>
</header>
