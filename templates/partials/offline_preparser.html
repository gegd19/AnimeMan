<section class="sheet" aria-labelledby="offlineTitle">
    <div class="sheet-head">
        <div>
            <h2 id="offlineTitle">离线 AI 预解析</h2>
            <p>提前扫描源文件夹并缓存 AI 解析结果。</p>
        </div>
        <div class="toolbar offline-actions">
            <button type="button" onclick="App.OfflinePreparser.scanFolders()" id="offlineScanBtn" class="success">扫描源文件夹</button>
            <button type="button" onclick="App.OfflinePreparser.runFullPreparse()" id="offlineParseBtn" class="warning">全量预解析</button>
            <button type="button" onclick="App.OfflinePreparser.refreshStatus()" class="secondary">刷新</button>
        </div>
    </div>
    <div class="sheet-body">
        <div class="status-pair">
            <span id="offlineScanStatus">尚未扫描</span>
            <span id="offlineCacheStatus">尚无缓存</span>
        </div>
        <p class="note">扫描只生成文件清单。实际处理时，如果 anitopy 解析失败且该文件夹没有缓存，会自动调用 AI 并保存结果（按需付费）。全量预解析是可选操作，会对所有未缓存的文件夹调用 AI。</p>
    </div>
</section>
