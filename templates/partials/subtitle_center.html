<div class="view-head">
    <h1 id="view-subtitles-title">字幕</h1>
</div>
<section class="sheet" aria-labelledby="subScanTitle">
    <div class="sheet-head">
        <div>
            <h2 id="subScanTitle">扫描与自动匹配</h2>
            <p>按标题相似度把字幕对应到媒体库里的条目，不需要手动选择目标。</p>
        </div>
    </div>
    <div class="sheet-body">
        <div class="field">
            <label for="subSourceFolderInput">字幕文件夹</label>
            <div class="path-input-group has-extra">
                <input type="text" id="subSourceFolderInput" placeholder="待整理字幕文件夹" autocomplete="off" spellcheck="false">
                <button type="button" class="browse" onclick="App.Browse.openBrowser('sub_source')">浏览</button>
                <button type="button" class="secondary" onclick="App.Config.setDefaultSubtitleFolder()" title="保存全部配置，并把当前路径设为默认字幕文件夹">设为默认</button>
            </div>
        </div>
        <div class="field">
            <label for="matchThresholdInput">匹配阈值</label>
            <div class="range-row">
                <input type="range" id="matchThresholdInput" min="0" max="100" value="75">
                <span id="thresholdValue" class="range-value">75</span>
            </div>
        </div>
        <div class="field">
            <span class="field-label">选项</span>
            <div class="check-row">
                <label class="check"><input type="checkbox" id="subtitleCenterAutoSyncCheck"><span>自动调轴（需 ffsubsync）</span></label>
                <label class="check"><input type="checkbox" id="overwriteCheck"><span>覆盖已有字幕</span></label>
            </div>
        </div>
        <div class="toolbar" style="margin-top: 16px;">
            <button type="button" class="primary" onclick="App.SubtitleCenter.scanSubtitleFolder()">扫描字幕</button>
            <button type="button" class="success" onclick="App.SubtitleCenter.autoMatchSubtitles()" id="matchBtn" disabled>自动匹配</button>
            <button type="button" class="success" onclick="App.SubtitleCenter.executeAllMatches()" id="executeAllBtn" disabled>全部执行</button>
        </div>

        <!-- 指定目标：强制匹配（电影/单季）与 AI 匹配（整部剧集） -->
        <div class="match-modes">
            <div class="match-mode">
                <h3>强制匹配</h3>
                <p>按季号和集号直接对应，忽略标题。</p>
                <div class="target-pick">
                    <span id="forceMatchShowDisplay" class="target-display">未选择</span>
                    <button type="button" onclick="App.SubtitleCenter.selectForceMatchShow()" class="secondary">选择电影或剧集季</button>
                </div>
                <div class="toolbar">
                    <button type="button" class="warning" onclick="App.SubtitleCenter.forceMatchToShow()" id="forceMatchBtn" disabled>强制匹配勾选的字幕</button>
                </div>
            </div>
            <div class="match-mode">
                <h3>AI 智能匹配</h3>
                <p>AI 从字幕文件名识别剧集标题，同一部剧只调用一次，再在媒体库里批量匹配。</p>
                <div class="target-pick">
                    <span id="selectedShowDisplay" class="target-display">未选择</span>
                    <button type="button" onclick="App.SubtitleCenter.selectTargetShow()" class="secondary">选择整部剧集</button>
                </div>
                <div class="toolbar">
                    <button type="button" onclick="App.SubtitleCenter.aiMatchToShow()" id="aiMatchBtn" class="success">AI 智能匹配</button>
                    <button type="button" onclick="App.SubtitleCenter.applyAiMatches()" id="applyAiMatchBtn" class="warning">一键入库</button>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="sheet" aria-labelledby="subResultTitle">
    <div class="sheet-head">
        <div class="toolbar">
            <h2 id="subResultTitle">匹配结果</h2>
            <label class="check" style="min-height: 0; padding: 0;">
                <input type="checkbox" id="subtitleSelectAllFixed" onchange="App.SubtitleCenter.toggleSelectAllSubtitle(this.checked)">
                <span>全选当前页</span>
            </label>
            <span class="count">已选 <span id="subtitleSelectedCount">0</span> 个文件</span>
        </div>
        <div class="toolbar">
            <label class="sr-only" for="subtitleSortSelect">排序方式</label>
            <select id="subtitleSortSelect" onchange="App.SubtitleCenter.setSortMode(this.value)">
                <option value="name" selected>按文件名排序</option>
                <option value="confidence">按匹配度排序</option>
            </select>
            <button type="button" onclick="App.SubtitleCenter.clearAllSelections()" class="secondary">清除选中</button>
        </div>
    </div>
    <div class="sheet-body">
        <div class="table-wrap">
            <table class="failed-table rows-as-cards" id="subtitleMatchTable">
                <thead>
                    <tr>
                        <th style="width:40px;"><input type="checkbox" id="subtitleSelectAll" aria-label="全选当前页" onchange="App.SubtitleCenter.toggleSelectAllSubtitle(this.checked)"></th>
                        <th>字幕文件</th>
                        <th>匹配结果</th>
                        <th>置信度</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="subtitleMatchBody">
                    <tr><td colspan="5">还没有数据。先扫描字幕文件夹，再自动匹配。</td></tr>
                </tbody>
            </table>
        </div>
        <!-- 分页控件 -->
        <div id="subtitlePagination"></div>
        <p class="note">勾选字幕后，可以用「自由选择」手动指定目标媒体。</p>

        <!-- AI 匹配结果表格 -->
        <div id="aiMatchResultsContainer" class="table-wrap" style="margin-top:15px; display:none;">
            <table class="failed-table">
                <thead>
                    <tr>
                        <th style="width:40px;">选择</th>
                        <th>原文件名</th>
                        <th>匹配集数</th>
                        <th>单集标题</th>
                        <th>建议新名称</th>
                        <th>置信度</th>
                    </tr>
                </thead>
                <tbody id="aiMatchResultsBody"></tbody>
            </table>
        </div>
    </div>
</section>
